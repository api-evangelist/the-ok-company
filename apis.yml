name: The OK Company
description: The OK Company was a consumer technology startup, backed by Obvious Ventures, best known
  for OK Play - a mobile app for iOS and Android that turned screen time into a catalyst for real-world,
  parent-and-child play activities designed to build empathy, kindness, and creativity in young children.
  It was founded by CEO JJ Aguhob and President Chris Ovitz (previously co-founders of the mobile video
  app Viddy), with developmental psychologist Dr. Colleen Russo Johnson as Chief Scientist. As of this
  enrichment pass the company appears defunct - its domain theokcompany.com no longer resolves to a product
  site and instead redirects to a third-party domain-sale listing. The OK Company was a consumer mobile
  app business and never published a public developer API, SDK, or developer platform, so there is no API
  surface to enrich. This profile is retained as a historical portfolio-company lead.
